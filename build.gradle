plugins { id 'com.android.application' version '8.13.2' }
android {
 namespace 'ro.cobrabm.fexdroid'
 compileSdk 35
 defaultConfig { applicationId 'com.emerytech.bloodbornethor'; minSdk 28; targetSdk 28; versionCode 22; versionName '2.2.0-thor.0.21.2' }
 sourceSets { main { manifest.srcFile 'out/thor-integrated/AndroidManifest.xml'; java.srcDirs=['tools/android/frontend/src']; res.srcDirs=['tools/android/frontend/res']; assets.srcDirs=['out/thor-integrated/assets','tools/thor/assets']; jniLibs.srcDirs=['out/thor-integrated/jniLibs'] } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
 packaging { jniLibs { useLegacyPackaging true; keepDebugSymbols += ['**/*.so']; pickFirsts += ['**/libzstd-jni*.so'] }
 resources { excludes += ['META-INF/INDEX.LIST','META-INF/DEPENDENCIES','META-INF/versions/9/module-info.class'] } }
 // Upstream native executable loading requires its API 28 target; GitHub distribution only.
 lint { disable 'ExpiredTargetSdkVersion' }
 androidResources { noCompress += ['payload','zip'] }
 signingConfigs { release { if(System.getenv('SIGNING_KEYSTORE')) { storeFile file(System.getenv('SIGNING_KEYSTORE'));storePassword System.getenv('SIGNING_STORE_PASSWORD');keyAlias System.getenv('SIGNING_KEY_ALIAS');keyPassword System.getenv('SIGNING_KEY_PASSWORD') } } }
 buildTypes { release { if(System.getenv('SIGNING_KEYSTORE')) signingConfig signingConfigs.release } }
}
dependencies { implementation fileTree(dir: '.local-deps/android/steam-libs/jars', include: ['*.jar']) }
